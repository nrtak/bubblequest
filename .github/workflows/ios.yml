name: iOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 scripts/prepare_assets.py
          xcodegen generate
      - name: Select simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "id=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: >-
          xcodebuild test -project BubbleQuest.xcodeproj -scheme BubbleQuest
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult
          CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/Tests.xcresult
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    needs: test
    runs-on: macos-15
    environment: testflight
    env:
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.nrtak.bubblequest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing credentials
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE_BASE64 }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          for name in P12 PASSWORD PROFILE ISSUER KEY_ID KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing signing credential: $name"; exit 1; fi
          done
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 scripts/prepare_assets.py
          xcodegen generate
      - uses: Apple-Actions/import-codesign-certs@v4
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install distribution profile
        id: signing
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: python3 scripts/install_profile.py
      - name: Archive
        env:
          TEAM: ${{ steps.signing.outputs.team }}
          PROFILE: ${{ steps.signing.outputs.profile }}
        run: |
          xcodebuild archive -project BubbleQuest.xcodeproj -scheme BubbleQuest \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/BubbleQuest.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          xcodebuild -exportArchive -archivePath build/BubbleQuest.xcarchive \
            -exportPath build/export -exportOptionsPlist build/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: BubbleQuest-ipa
          path: build/export/BubbleQuest.ipa
      - uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: build/export/BubbleQuest.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
