name: BubbleQuest
options:
  bundleIdPrefix: com.nrtak
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  BubbleQuest:
    type: application
    platform: iOS
    sources: [BubbleQuest]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bubblequest.app
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Bubble Quest
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  BubbleQuestTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BubbleQuestTests]
    dependencies:
      - target: BubbleQuest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BubbleQuest:
    build:
      targets:
        BubbleQuest: all
    test:
      targets: [BubbleQuestTests]
