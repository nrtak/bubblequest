name: BubbleQuest
options:
  bundleIdPrefix: com.nrtak
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  BubbleQuest:
    type: application
    platform: iOS
    sources: [BubbleQuest]
    preBuildScripts:
      - name: Verify iOS SDK
        basedOnDependencyAnalysis: false
        script: |
          case "${SDK_VERSION%%.*}" in
            ''|*[!0-9]*) echo "error: Cannot determine iOS SDK version from '$SDK_VERSION'"; exit 1 ;;
          esac
          if [ "${SDK_VERSION%%.*}" -lt 27 ]; then
            echo "error: Bubble Quest requires iOS SDK 27 or newer. Found $SDK_VERSION."
            exit 1
          fi
          echo "Building Bubble Quest with $SDK_NAME"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bubbleadventure.app
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Bubble Quest
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  BubbleQuestTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BubbleQuestTests]
    dependencies:
      - target: BubbleQuest
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BubbleQuest:
    build:
      targets:
        BubbleQuest: all
    test:
      targets: [BubbleQuestTests]
