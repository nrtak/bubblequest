name: iOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 scripts/prepare_assets.py
          sips -z 1024 1024 BubbleQuest/icon-shiba-source.png --out BubbleQuest/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - name: Select simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          echo "id=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: >-
          xcodebuild test -project BubbleQuest.xcodeproj -scheme BubbleQuest
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
          -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Capture iPhone gameplay
        if: github.event_name == 'pull_request'
        env:
          DEVICE: ${{ steps.simulator.outputs.id }}
        run: |
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/DerivedData/Build/Products/Debug-iphonesimulator/BubbleQuest.app
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --gameplay-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/gameplay-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --gameplay-preview --dusk-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/gameplay-dusk-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --map-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/map-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --map-preview --dusk-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/map-night-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --cancel-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/cancel-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/title-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --gameplay-preview --courtyard-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/courtyard-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --gameplay-preview --water-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/water-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --gameplay-preview --tea-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/tea-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --host-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/host-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --settings-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/settings-iphone.png
          xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --ending-preview
          sleep 3
          xcrun simctl io "$DEVICE" screenshot build/ending-iphone.png
          for SCENE in players festival buddy purple pressure friends quest quest-detail quest-reward wheel lantern pearl spark beach hill summer-map summer-neighbor summer-buddies; do
            xcrun simctl launch --terminate-running-process "$DEVICE" com.bubbleadventure.app --gameplay-preview "--${SCENE}-preview"
            sleep 3
            xcrun simctl io "$DEVICE" screenshot "build/${SCENE}-iphone.png"
          done
      - name: Capture compact iPhone screens
        if: github.event_name == 'pull_request'
        env:
          DEVICE: ${{ steps.simulator.outputs.id }}
        run: |
          RUNTIME=$(xcrun simctl list devices available -j | python3 -c 'import json,os,sys; d=json.load(sys.stdin); print(next(k for k,v in d["devices"].items() if any(x["udid"] == os.environ["DEVICE"] for x in v)))')
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["identifier"] for x in d["devicetypes"] if x["name"] == "iPhone SE (3rd generation)"))')
          xcrun simctl shutdown "$DEVICE"
          COMPACT=$(xcrun simctl create BubbleQuestCompact "$TYPE" "$RUNTIME")
          xcrun simctl boot "$COMPACT"
          xcrun simctl bootstatus "$COMPACT" -b
          xcrun simctl status_bar "$COMPACT" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$COMPACT" build/DerivedData/Build/Products/Debug-iphonesimulator/BubbleQuest.app
          for SCENE in gameplay map friends settings wheel beach hill summer-map summer-buddies; do
            xcrun simctl launch --terminate-running-process "$COMPACT" com.bubbleadventure.app "--${SCENE}-preview"
            sleep 3
            xcrun simctl io "$COMPACT" screenshot "build/${SCENE}-compact-iphone.png"
          done
          xcrun simctl launch --terminate-running-process "$COMPACT" com.bubbleadventure.app
          sleep 3
          xcrun simctl io "$COMPACT" screenshot build/home-compact-iphone.png
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: gameplay-iphone
          path: build/*-iphone.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/Tests.xcresult
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
    needs: test
    runs-on: macos-26
    environment: testflight
    env:
      BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.bubbleadventure.app' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing credentials
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROFILE_BASE64 }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          for name in P12 PASSWORD PROFILE ISSUER KEY_ID KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing signing credential: $name"; exit 1; fi
          done
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 scripts/prepare_assets.py
          sips -z 1024 1024 BubbleQuest/icon-shiba-source.png --out BubbleQuest/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          xcodegen generate
      - uses: Apple-Actions/import-codesign-certs@v4
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Install distribution profile
        id: signing
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: python3 scripts/install_profile.py
      - name: Archive
        env:
          TEAM: ${{ steps.signing.outputs.team }}
          PROFILE: ${{ steps.signing.outputs.profile }}
        run: |
          xcodebuild archive -project BubbleQuest.xcodeproj -scheme BubbleQuest \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/BubbleQuest.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          xcodebuild -exportArchive -archivePath build/BubbleQuest.xcarchive \
            -exportPath build/export -exportOptionsPlist build/ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: BubbleQuest-ipa
          path: build/export/BubbleQuest.ipa
      - uses: Apple-Actions/upload-testflight-build@v5
        with:
          backend: altool
          app-path: build/export/BubbleQuest.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
